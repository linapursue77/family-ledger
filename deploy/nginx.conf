# 家庭财务通 · nginx
# 挂载到 /etc/nginx/conf.d/default.conf
#
# 前端是 hash 路由（/#/family），服务端只需在未知路径回 index.html，
# 不需要 history fallback 那套 try_files 规则。
# 接口走相对路径 /api/v1，与主站同源，因此不涉及跨域。

upstream web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # 后端账单导入上限 10MB（apps/ledger/services.py MAX_UPLOAD_BYTES），留一倍余量。
    # 不改这条，微信/支付宝账单导入必然 413。
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # 带内容指纹的构建产物可长缓存
    location ~* ^/assets/.*\.(js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* ^/(icons|assets)/.*\.(png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # 入口页与 manifest 不缓存：发新版立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location /api/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        proxy_pass http://web;
    }
    location /media/ {
        proxy_pass http://web;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS：证书就位后把上面 listen 80 改成 443 并启用这一段，或直接用 certbot 申请。
